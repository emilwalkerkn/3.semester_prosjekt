
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: semesterprosjekt
      MARIADB_USER: appuser
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?Set DEV_DB_ROOT_PASSWORD}
    volumes:
      - mariadb_publicactor_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "3309:3306"

  semesterprosjekt:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=semesterprosjekt;User=appuser;Password=${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD};"
      LocalDemo__Enabled: "false"
      ASPNETCORE_ENVIRONMENT: Development
      #skrur av automatisk tildeling av administratorrettigheter
      OrganizationAdminTestSeeder__Enabled: "false"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8081:8080"
    volumes:
      - publicactor_keys:/keys

volumes:
  mariadb_publicactor_data:
  publicactor_keys:
