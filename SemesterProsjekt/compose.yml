services:
  semesterprosjekt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=semesterprosjekt;User=appuser;Password=apppassword;"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: semesterprosjekt
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppassword
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  mariadb_data: